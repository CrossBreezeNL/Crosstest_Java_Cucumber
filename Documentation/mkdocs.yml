# Project information
site_name: 'CrossTest v1.0.22'

# Copyright
copyright: 'Copyright &copy; 2026 - CrossBreeze'

# Configuration
theme:
  name: 'material'
  logo: 'img/x-test-icon.png'
  favicon: 'img/favicon.ico'
  language: 'en'
  palette:
    primary: 'blue grey'
    accent: 'green'
  features:
    tabs: true

# Pages
nav:
- Home:
    - 'Introduction'    : 'index.md'
    - 'Getting started' : 'GettingStarted.md'   
    - 'Release notes'   : 'ReleaseNotes.md'
- Steps:
  - 'Introduction'       : 'Steps/index.md'
  - 'Process' : 'Steps/Process.md'
  - 'Context' : 'Steps/Context.md'
  - 'Query' : 'Steps/Query.md'
  - 'DbTable' : 'Steps/DbTable.md'
  - 'Result' : 'Steps/Result.md'
  - 'ObjectTemplate' : 'Steps/ObjectTemplate.md'
  - 'ProcessConfig' : 'Steps/ProcessConfig.md'
  - 'Tables'       : 'Steps/Tables.md'
- Configuration:
  - 'Introduction'       : 'Configuration/index.md'
  - 'Includes' : 'Configuration/config_include.md'
  - 'Schema file'   : 'Configuration/CrossTestConfig.xsd'
  
# Extra
extra:
  social:
    - icon: fontawesome/brands/twitter
      link: 'https://twitter.com/CrossBreeze_NL'

# Extensions
markdown_extensions:
  - codehilite
  - toc:
      permalink: true
  - footnotes
  - admonition
  - def_list
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde