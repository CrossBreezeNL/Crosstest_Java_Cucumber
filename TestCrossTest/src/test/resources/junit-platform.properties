cucumber.publish.quiet=true
cucumber.glue=com.xbreeze.xtest
cucumber.plugin=pretty, junit:target/TestResults.xml, me.jvt.cucumber.report.PrettyReports:target
cucumber.junit-platform.naming-strategy=long
# PowerCenter is deprecated and @InProgress scenarios are unfinished, so both are skipped by default. Passing -Dcucumber.filter.tags=... replaces this filter.
cucumber.filter.tags=not @PowerCenter and not @InProgress